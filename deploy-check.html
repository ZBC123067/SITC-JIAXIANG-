<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SITC JIAXIANG V14 部署检查</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:#172033;background:#eef5fb}
    *{box-sizing:border-box}body{margin:0;padding:28px 16px}.card{width:min(720px,100%);margin:auto;padding:24px;border:1px solid rgba(21,94,150,.15);border-radius:24px;background:rgba(255,255,255,.92);box-shadow:0 18px 48px rgba(29,76,112,.14)}
    h1{margin:0 0 8px;font-size:25px}.sub{margin:0 0 20px;color:#607487;font-size:13px;line-height:1.6}.build{display:inline-flex;margin-bottom:18px;padding:7px 12px;border-radius:999px;color:#fff;background:linear-gradient(135deg,#138cff,#006bd8);font-size:12px;font-weight:900}
    .checks{display:grid;gap:9px}.row{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:12px;border:1px solid #dce7ef;border-radius:14px;background:#f9fcff}.row b{display:block;font-size:13px}.row small{display:block;margin-top:4px;color:#708395;word-break:break-all}.icon{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#9aa8b3;font-size:12px;font-weight:900}.row.ok{border-color:#9ad8b0;background:#f0fbf4}.row.ok .icon{background:#20a65a}.row.bad{border-color:#f0a5a5;background:#fff3f3}.row.bad .icon{background:#e14848}
    .summary{margin-top:18px;padding:14px;border-radius:16px;background:#fff4de;color:#805100;font-size:13px;font-weight:800;line-height:1.55}.summary.ok{background:#eaf9ef;color:#13703a}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.actions a{min-height:46px;display:grid;place-items:center;border-radius:14px;text-decoration:none;font-size:13px;font-weight:850}.front{color:#fff;background:#087cf0}.admin{color:#172033;border:1px solid #d6e0e8;background:#fff}@media(max-width:520px){body{padding:14px 10px}.card{padding:18px}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <span class="build">SITC JIAXIANG · V14</span>
    <h1>GitHub Pages 部署检查</h1>
    <p class="sub">本页会检查前台、管理后台、手机端样式、手机端功能脚本和缓存文件是否全部上传到当前目录。</p>
    <section class="checks" id="checks"></section>
    <div class="summary" id="summary">正在检查…</div>
    <div class="actions"><a class="front" href="./index.html?build=v14">打开订舱前台</a><a class="admin" href="./admin.html?build=v14">打开管理后台</a></div>
  </main>
  <script>
    const tests=[
      ["前台 index.html","./index.html?deploy-check=v14","<meta name=\"sitc-build\" content=\"V14\""],
      ["管理后台 admin.html","./admin.html?deploy-check=v14","SITC JIAXIANG 订舱管理后台"],
      ["手机端样式 mobile-v2.css","./assets/mobile-v2.css?deploy-check=v14","SITC_MOBILE_BUILD_V14"],
      ["手机端功能 mobile-v2.js","./assets/mobile-v2.js?deploy-check=v14","SITC_MOBILE_BUILD_V14"],
      ["Service Worker","./service-worker.js?deploy-check=v14","mobile-shell-v14"],
      ["版本标识 VERSION.txt","./VERSION.txt?deploy-check=v14","SITC JIAXIANG Booking V14"]
    ];
    const box=document.getElementById("checks"),summary=document.getElementById("summary");
    Promise.all(tests.map(async([name,url,signature])=>{
      let ok=false,detail="";
      try{const response=await fetch(url,{cache:"no-store"});const text=await response.text();ok=response.ok&&text.includes(signature);detail=ok?`${response.status} · V14 已确认`:`${response.status} · 文件缺失或仍是旧版`}
      catch(error){detail=`无法读取：${error.message}`}
      const row=document.createElement("div");row.className=`row ${ok?"ok":"bad"}`;row.innerHTML=`<span class="icon">${ok?"✓":"!"}</span><span><b>${name}</b><small>${detail} · ${new URL(url,location.href).pathname}</small></span>`;box.append(row);return ok;
    })).then(results=>{const count=results.filter(Boolean).length;summary.className=`summary ${count===results.length?"ok":""}`;summary.textContent=count===results.length?"6/6 全部通过：V14 已完整部署，可以正常使用。":`${count}/${results.length} 通过：请把 V14 发布包内的全部文件和文件夹上传到仓库 main 分支根目录，不能只上传 index.html。`;});
  </script>
</body>
</html>
